<html>
  <head>
    <title>carbon-web-components example</title>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://1.www.s81c.com/common/carbon-for-ibm-dotcom/tag/v1/latest/plex.css"
    />

    <link rel="stylesheet" href="styles.scss" />
    <script type="module" src="index.js"></script>
  </head>
  <body>
    <cds-table size="sm">
      <cds-table-toolbar size="lg" slot="toolbar">
        <cds-tile size="lg">
          <cds-table-toolbar-content>
            <cds-grid narrow full-width>
              <cds-column
                xs="8"
                sm="4"
                md="8"
                lg="6"
                xlg="11"
                class="filters-column"
              >
                <div class="filters-wrapper">
                  <cds-multi-select  size="md">
                    <cds-multi-select-item value="example" selected 
                      >An example preselected option</cds-multi-select-item
                    >
                    <cds-multi-select-item value="all"
                      >Option 1</cds-multi-select-item
                    >
                  </cds-multi-select>
                </div>
              </cds-column>
            </cds-grid>
          </cds-table-toolbar-content>
        </cds-tile>
      </cds-table-toolbar>
      <cds-table-head>
        <cds-table-header-row selection-name="header">
          <cds-table-header-cell>Name</cds-table-header-cell>
          <cds-table-header-cell>Protocol</cds-table-header-cell>
          <cds-table-header-cell>Port</cds-table-header-cell>
          <cds-table-header-cell>Rule</cds-table-header-cell>
          <cds-table-header-cell>Attached groups</cds-table-header-cell>
          <cds-table-header-cell>Status</cds-table-header-cell>
        </cds-table-header-row>
      </cds-table-head>
      <cds-table-body>
        <cds-table-row selection-name="0">
          <cds-table-cell>Load Balancer 3</cds-table-cell>
          <cds-table-cell>HTTP</cds-table-cell>
          <cds-table-cell>3000</cds-table-cell>
          <cds-table-cell>Round robin</cds-table-cell>
          <cds-table-cell>Kevin's VM Groups</cds-table-cell>
          <cds-table-cell
            ><cds-link disabled="">Disabled</cds-link></cds-table-cell
          >
        </cds-table-row>
      </cds-table-body>
    </cds-table>
  </body>
</html>
